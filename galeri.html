e(-50%);box-shadow:0 12px 30px -14px #783c7880}.path-btn{cursor:pointer;font-size:.85rem;font-weight:600;font-family:var(--font);color:var(--muted);background:0 0;border:0;border-radius:999px;padding:.5rem .95rem;transition:all .25s}.path-btn:hover{color:var(--text)}.path-btn.active{color:#fff;background:var(--grad);box-shadow:0 8px 22px -8px #ff5c9d99}.scroll-toggle{border:1px solid var(--line);cursor:pointer;font-size:.85rem;font-weight:600;font-family:var(--font);color:var(--text);background:#ffffffb8;border-radius:999px;padding:.55rem 1.05rem;transition:all .25s;box-shadow:0 6px 18px -10px #783c7880}.scroll-toggle:hover{border-color:var(--aqua);color:var(--aqua)}.scroll-toggle.active{background:var(--grad);color:#fff;border-color:#0000}.g-hint{z-index:9;border:1px solid var(--line);color:var(--text);letter-spacing:.02em;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);background:#ffffffb8;border-radius:999px;padding:.7rem 1.3rem;font-size:.95rem;transition:opacity .5s;animation:2.4s ease-in-out infinite floaty;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 12px 30px -16px #783c7880}@keyframes floaty{0%,to{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 8px))}}#loader{z-index:50;background:var(--bg);flex-direction:column;justify-content:center;align-items:center;gap:18px;transition:opacity .6s;display:flex;position:fixed;inset:0}.loader-ring{border:3px solid #ff5c9d2e;border-top-color:var(--pink);border-radius:50%;width:52px;height:52px;animation:1s linear infinite spin}.loader-txt{color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-size:.78rem}@keyframes spin{to{transform:rotate(360deg)}}.hidden{pointer-events:none;opacity:0!important}@media (width<=520px){.g-brand{display:none}.path-btn{padding:.45rem .7rem;font-size:.78rem}}
